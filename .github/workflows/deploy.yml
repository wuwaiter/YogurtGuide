name: Verify production

# 正式網站只有 Cloudflare（2026-11-27 拿掉 GitHub Pages）。部署由 Cloudflare 自己的 Git 連線負責：
# Build command 是 npm run check:deploy，Deploy command 是 npx wrangler deploy（讀 wrangler.toml）。
# 不要把 Cloudflare token 放進 GitHub secrets，也不要在這裡用 wrangler 上傳。
# 這個 workflow 只做一件事：合併到 main 後，讀正式網站公開的 /build.json，
# commit 和這次 push 不同就失敗（Cloudflare 有時收不到 push），GitHub 會寄通知。
# 合併前的檢查（gitleaks、check:deploy、Playwright）在 ci.yml，main 必須走 PR 且 CI 通過。

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-verify
  cancel-in-progress: false

jobs:
  verify-cloudflare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EXPECTED: ${{ github.sha }}
      BUILD_URL: https://yogurtguide.wuwaiter.com/build.json
    steps:
      - name: Wait for Cloudflare to serve this commit
        run: |
          # Cloudflare 建置約 1–3 分鐘。每分鐘查一次，最多 15 次。
          for attempt in $(seq 1 15); do
            sleep 60
            live=$(curl -fsS "${BUILD_URL}?run=${GITHUB_RUN_ID}-${attempt}" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{console.log(JSON.parse(s).commit)}catch{console.log('')}})" || true)
            echo "第 ${attempt} 次：正式網站 ${live:-讀不到}，預期 ${EXPECTED}"
            # Cloudflare 給的可能是短 SHA，用前綴比對。
            if [ -n "$live" ] && [ "${EXPECTED#"$live"}" != "$EXPECTED" ]; then
              echo "Cloudflare 已部署這個 commit。"
              exit 0
            fi
          done
          echo "::error::15 分鐘後正式網站仍不是這個 commit。Cloudflare 可能沒收到這次 push，請到 Cloudflare 後台重新建置，或推一個空 commit。"
          exit 1
