name: Deploy

# 兩邊分開部署，檢查指令都是 npm run check:deploy。
# - GitHub Pages：這個 workflow。檢查失敗就不上線。
# - Cloudflare Workers：Cloudflare 自己的 Git 連線，Build command 也設成 npm run check:deploy，Deploy command 用 npx wrangler deploy（讀 wrangler.toml）。
# 不要把 Cloudflare token 放進 GitHub secrets，也不要在這裡用 wrangler 上傳。

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check and build
        run: npm run check:deploy

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy-github:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
